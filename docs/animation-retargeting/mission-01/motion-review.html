<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,">
<title>Spellbound motion review</title><style>body{margin:0;background:#152027;color:#fff;font:14px system-ui}canvas{display:block}#controls{position:fixed;top:0;left:0;right:0;background:#111d;padding:10px;z-index:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{min-height:40px}#seek{width:160px}#status{width:100%;font-size:12px}input[type=file]{max-width:210px}</style><div id="controls"><input id="capture" type="file" accept=".json,application/json" aria-label="Open saved motion capture"><button id="play">Pause</button><select id="view" aria-label="View angle"><option value="0">Front</option><option value="-1.57079632679">Right side</option><option value="3.14159265359">Back</option><option value="1.57079632679">Left side</option></select><input id="seek" type="range" min="0" max="1" step=".001" value="0" aria-label="Motion time"><span id="status">Loading verified running clip. Captures stay on this device.</span></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17232c);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x747c82,3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,6,5);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x354651,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const root=new THREE.Group();scene.add(root);const {scene:model}=await new GLTFLoader().loadAsync('assets/player/character-mobile-optimized.glb');model.rotation.x=-Math.PI/2;model.traverse(o=>{if(o.isMesh){const restore=m=>new THREE.MeshStandardMaterial({map:m.map,color:m.color.clone(),roughness:.85,metalness:0,emissive:0xffffff,emissiveMap:m.map,emissiveIntensity:.12});o.material=Array.isArray(o.material)?o.material.map(restore):restore(o.material)}});root.add(model);const clip=THREE.AnimationClip.parse(await (await fetch('assets/animations/Ch08_Run_Verified_v1.json')).json()),mixer=new THREE.AnimationMixer(model),action=mixer.clipAction(clip).play();mixer.setTime(0);model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model,true);model.scale.setScalar(2.05/box.getSize(new THREE.Vector3()).y);model.updateMatrixWorld(true);const fitted=new THREE.Box3().setFromObject(model,true),center=fitted.getCenter(new THREE.Vector3());model.position.set(-center.x,-fitted.min.y,-center.z);
const bound=new Set();model.traverse(o=>{if(o.isSkinnedMesh)for(const b of o.skeleton.bones)bound.add(b)});const bones=new Map([...bound].map(b=>[b.name,b])),right=[...bound].filter(b=>/Right(Shoulder|Arm|ForeArm|Hand)$/.test(b.name));const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(right.map(()=>new THREE.Vector3())),new THREE.LineBasicMaterial({color:0xffa95e,depthTest:false}));line.renderOrder=1000;scene.add(line);
let capture=null,playing=true,cursor=0,last=performance.now();const status=document.querySelector('#status'),seek=document.querySelector('#seek');document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};seek.oninput=()=>{cursor=Number(seek.value)*(capture?capture.samples.at(-1).at-capture.samples[0].at:clip.duration);draw()};
const finite=(a,n)=>Array.isArray(a)&&a.length===n&&a.every(v=>Number.isFinite(v)&&Math.abs(v)<100000);
document.querySelector('#capture').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>4000000)throw Error('Capture exceeds 4 MB');const data=JSON.parse(await f.text());if(data.schema!==1||!Array.isArray(data.samples)||!data.samples.length||data.samples.length>160)throw Error('Unsupported capture');let previous=-Infinity;for(const s of data.samples){if(!Number.isFinite(s.at)||s.at<previous||!s.rig||!Array.isArray(s.rig.bones)||s.rig.bones.length>200)throw Error('Missing replay data');previous=s.at;for(const b of s.rig.bones)if(typeof b.name!=='string'||!finite(b.q,4)||!finite(b.p,3))throw Error('Invalid joint');for(const [k,n] of [['p',3],['q',4],['s',3]])if(!finite(s.rig.model[k],n))throw Error('Invalid model transform')};capture=data;cursor=0;draw()}catch(err){status.textContent=err.message}};
function draw(){if(capture){const sample=capture.samples.reduce((best,s)=>Math.abs(s.at-capture.samples[0].at-cursor)<Math.abs(best.at-capture.samples[0].at-cursor)?s:best,capture.samples[0]);mixer.stopAllAction();for(const b of sample.rig.bones){const bone=bones.get(b.name);if(bone){bone.quaternion.fromArray(b.q);bone.position.fromArray(b.p)}}model.position.fromArray(sample.rig.model.p);model.quaternion.fromArray(sample.rig.model.q);model.scale.fromArray(sample.rig.model.s);root.position.set(0,0,0);root.quaternion.identity();status.textContent=`${sample.state.element} · ${sample.state.motion} · owner: ${sample.state.owner} · writers: ${sample.writers.map(w=>w.layer).join(', ')}`;}else{mixer.setTime(cursor);status.textContent=`Verified Ch08 run · ${cursor.toFixed(3)} / ${clip.duration.toFixed(3)} seconds`;}model.updateMatrixWorld(true);const p=line.geometry.attributes.position;right.forEach((b,i)=>{const v=b.getWorldPosition(new THREE.Vector3());p.setXYZ(i,v.x,v.y,v.z)});p.needsUpdate=true;const angle=Number(document.querySelector('#view').value);camera.position.set(Math.sin(angle)*5.5,2.1,Math.cos(angle)*5.5);camera.lookAt(0,1.1,0);renderer.render(scene,camera)}
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const duration=capture?capture.samples.at(-1).at-capture.samples[0].at:clip.duration;if(playing)cursor=(cursor+dt)%Math.max(.001,duration);seek.value=cursor/Math.max(.001,duration);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.__motionReview={get ready(){return true},setTime(time){playing=false;cursor=time;draw()},setView(angle){document.querySelector('#view').value=String(angle);draw()},get bones(){return [...bones.values()].map(b=>({name:b.name,q:b.quaternion.toArray(),localP:b.position.toArray(),p:b.getWorldPosition(new THREE.Vector3()).toArray()}))}};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
