<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a2733"><title>Spellbound 3D — Stormbreak</title>
<style>

</style></head><body><div id="loading"><strong>SPELLBOUND</strong><span id="loadtext">Awakening the citadel…</span><span id="error"></span></div><div id="ui"><div id="brand"><h1>SPELLBOUND</h1><small>THE FORGOTTEN CITADEL</small></div><div id="actions"><button id="intro">Replay</button><button id="quality">Quality: Auto</button></div><div id="bottom">DRAG TO LOOK AROUND · PINCH TO ZOOM</div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const mobile=/iPhone|iPad|Android/i.test(navigator.userAgent),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x566572);scene.fog=new THREE.FogExp2(0x82909b,.013);
const camera=new THREE.PerspectiveCamera(mobile?57:52,innerWidth/innerHeight,.1,450);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xb7d4ec,0x343b42,2.4);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd7a0,3.2);sun.position.set(-16,34,-26);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-33;sun.shadow.camera.right=33;sun.shadow.camera.top=33;sun.shadow.camera.bottom=-33;sun.shadow.camera.near=1;sun.shadow.camera.far=110;sun.shadow.bias=-.0004;scene.add(sun);
const fill=new THREE.DirectionalLight(0x7898b6,.85);fill.position.set(16,12,10);scene.add(fill);
const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const stones=[mat(0x687075),mat(0x737978),mat(0x565f65),mat(0x848580),mat(0x505c61)],moss=mat(0x394f3f),dark=mat(0x3c474e),gold=mat(0xc8a46d,.7),wood=mat(0x453c35);
let seed=28;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function rand(a,b){return a+(b-a)*rnd()}
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.receiveShadow=true;o.castShadow=true;scene.add(o);return o}
function block(x,y,z,w,h,d,m=stones[0]){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z)}
function cylinder(x,y,z,rt,rb,h,m=stones[0],s=12){return mesh(new THREE.CylinderGeometry(rt,rb,h,s),m,x,y,z)}
const terrain=mesh(new THREE.CylinderGeometry(37,40,3,80),dark,0,-1.65,0);terrain.castShadow=false;
const tileGeo=new THREE.BoxGeometry(1,1,1);for(let x=-20;x<=20;x+=1.65){for(let z=-19;z<=20;z+=1.65){if(x*x+z*z>19.7*19.7)continue;let w=1.55+rand(-.12,.06),d=1.55+rand(-.12,.06);const o=mesh(tileGeo,stones[Math.floor(rnd()*stones.length)],x+rand(-.12,.12),-.04+rand(-.035,.035),z+rand(-.12,.12));o.scale.set(w,.16,d);o.rotation.y=rand(-.035,.035);o.castShadow=false;if(rnd()<.065){const patch=mesh(new THREE.PlaneGeometry(rand(.3,.9),rand(.3,.9)),moss,x,-.123,z);patch.rotation.x=-Math.PI/2;patch.castShadow=false;}}}
function wall(x,z,w,h,d){block(x,h/2-.02,z,w,h,d,stones[2]);for(let y=1;y<h;y+=1.15){block(x,y,z+d/2+.045,w,.065,.12,stones[1]);}for(let i=0;i<Math.floor(w/1.8);i++){let bx=x-w/2+(i+.5)*w/Math.floor(w/1.8);block(bx,h+.4,z,.9,.8,d+.3,stones[i%3]);}}
wall(-22,0,2.8,8,40);wall(22,0,2.8,8,40);wall(0,21,41,6,2.5);
function tower(x,z,height,broken=false){cylinder(x,height/2,z,3.7,4.2,height,stones[2],12);for(let y=2;y<height;y+=3){cylinder(x,y,z,4.18,4.18,.3,stones[1],12)}cylinder(x,height+.2,z,4.35,4.35,.6,stones[0],12);for(let i=0;i<12;i++){if(broken&&i%4===0)continue;const a=i*Math.PI/6;block(x+3.8*Math.cos(a),height+.95,z+3.8*Math.sin(a),1.3,1.5,1.2,stones[i%3]).rotation.y=-a;}for(let y=4;y<height-3;y+=6){let slit=block(x,y,z+3.76,.38,1.7,.13,dark);slit.castShadow=false;}}
tower(-20,-21,23,false);tower(20,-21,17,true);
function pillar(x,z){block(x,5.4,z,3.1,10.8,3.4,stones[2]);block(x,11,z,3.8,.9,4,stones[1]);block(x,.5,z,4.1,1,4,stones[1]);for(let i=0;i<4;i++){block(x+(i-1.5)*.65,6,z+1.76,.12,9,.12,stones[0]);}}
pillar(-7,-23);pillar(7,-23);block(0,12,-23,17.2,3.2,4,stones[2]);block(0,14,-23,19,1.1,5,stones[1]);for(let i=0;i<11;i++)block(-9+i*1.8,15.2,-23,1.05,1.35,4.5,stones[i%3]);
const archCurve=new THREE.Shape();archCurve.moveTo(-5.3,0);archCurve.lineTo(-5.3,7);archCurve.absarc(0,7,5.3,Math.PI,0,true);archCurve.lineTo(5.3,0);const hole=new THREE.Path();hole.moveTo(-3.9,-1);hole.lineTo(3.9,-1);hole.lineTo(3.9,7);hole.absarc(0,7,3.9,0,Math.PI,false);hole.lineTo(-3.9,-1);archCurve.holes.push(hole);
const archMesh=mesh(new THREE.ExtrudeGeometry(archCurve,{depth:3,bevelEnabled:false,curveSegments:16}),stones[0],0,.3,-25);archMesh.castShadow=true;
for(let i=0;i<10;i++){let a=i*Math.PI/9;let x=4.7*Math.cos(a),y=7+4.7*Math.sin(a);const o=block(x,y,-21.9,.13,.75,.2,gold);o.rotation.z=a-Math.PI/2;o.castShadow=false;}
for(let i=0;i<11;i++){const z=17+i*1.6;block(0,.1+i*.23,z,12,.35,1.65,stones[i%3]);}
for(let i=0;i<16;i++){const a=i*Math.PI*2/16;const x=17*Math.cos(a),z=17*Math.sin(a);if(z<-14||Math.abs(x)>16)continue;const b=block(x,.45,z,1.3,.9,1.4,stones[i%3]);b.rotation.y=a;}
for(let i=0;i<80;i++){let a=rand(0,Math.PI*2),r=rand(12,19),x=Math.cos(a)*r,z=Math.sin(a)*r;if(z<-14)continue;let grass=mesh(new THREE.ConeGeometry(rand(.06,.2),rand(.3,.8),3),moss,x,.22,z);grass.castShadow=false;}
for(let i=0;i<22;i++){let x=rand(-17,17),z=rand(-17,17);if(Math.abs(x)<8&&z<0)continue;const o=block(x,.1,z,rand(.25,.7),rand(.15,.35),rand(.2,.7),stones[i%3]);o.rotation.y=rand(0,6);}
const mountainMat=mat(0x4a5863);for(let i=0;i<25;i++){let a=i/25*Math.PI*2,r=rand(95,140),height=rand(24,85);const peak=mesh(new THREE.ConeGeometry(rand(17,34),height,5),mountainMat,Math.sin(a)*r,height/2-15,Math.cos(a)*r);peak.rotation.y=rand(0,3);peak.castShadow=false;peak.receiveShadow=false;}
const farMat=mat(0x6a7780);for(let i=0;i<18;i++){let a=i/18*Math.PI*2,r=rand(150,205),height=rand(35,105);const o=mesh(new THREE.ConeGeometry(rand(25,46),height,5),farMat,Math.sin(a)*r,height/2-26,Math.cos(a)*r);o.castShadow=false;}
const clouds=[];const cloudMat=new THREE.MeshBasicMaterial({color:0x313d4a,transparent:true,opacity:.35,depthWrite:false});for(let i=0;i<22;i++){const o=mesh(new THREE.SphereGeometry(1,8,6),cloudMat,rand(-130,130),rand(48,85),rand(-150,40));o.scale.set(rand(20,43),rand(3,8),rand(11,27));o.castShadow=false;clouds.push(o);}
const rays=[];const rayMat=new THREE.MeshBasicMaterial({color:0xffd59a,transparent:true,opacity:.07,depthWrite:false,side:THREE.DoubleSide});for(let i=0;i<4;i++){const o=mesh(new THREE.ConeGeometry(rand(7,13),75,24,1,true),rayMat,-20+i*6,32,-29+i*2);o.rotation.z=.3;o.castShadow=false;rays.push(o);}
const particles=[];const particleMat=new THREE.PointsMaterial({color:0xffe5bd,size:.12,transparent:true,opacity:.65,sizeAttenuation:true});const pos=new Float32Array(90*3);for(let i=0;i<90;i++){pos[i*3]=rand(-18,18);pos[i*3+1]=rand(.5,14);pos[i*3+2]=rand(-18,18)}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));const dust=new THREE.Points(pg,particleMat);scene.add(dust);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=3.2;controls.maxDistance=15;controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=.35;controls.target.set(0,1.6,0);
const targetPos=new THREE.Vector3(0,2.65,7.7),targetLook=new THREE.Vector3(0,1.6,-6);
let introStart=performance.now(),introActive=!reduced,mixer=null,character=null;
let leftHand=null,rightHand=null;
const fireGroup=new THREE.Group();scene.add(fireGroup);
const fireCore=new THREE.Mesh(new THREE.SphereGeometry(.15,16,12),new THREE.MeshBasicMaterial({color:0xffb338,transparent:true,opacity:.86,depthWrite:false}));
fireGroup.add(fireCore);
const fireLight=new THREE.PointLight(0xff7c24,2.3,4,2);fireGroup.add(fireLight);
const flameMat=new THREE.MeshBasicMaterial({color:0xff8b22,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
const flameGeo=new THREE.ConeGeometry(.085,.33,5);
const flames=[];for(let i=0;i<24;i++){const f=new THREE.Mesh(flameGeo,flameMat.clone());fireGroup.add(f);flames.push(f)}
const emberGeo=new THREE.SphereGeometry(.018,5,4),embers=[];for(let i=0;i<35;i++){const e=new THREE.Mesh(emberGeo,new THREE.MeshBasicMaterial({color:i%3?0xffa23c:0xffe5a3,transparent:true,opacity:.8,depthWrite:false}));fireGroup.add(e);embers.push(e)}
const leftPos=new THREE.Vector3(),rightPos=new THREE.Vector3(),fireMid=new THREE.Vector3();
function animateFire(time){
 if(!character)return;
 character.updateMatrixWorld(true);
 if(leftHand&&rightHand){leftHand.getWorldPosition(leftPos);rightHand.getWorldPosition(rightPos)}
 else{leftPos.set(-.38,1.32,.42);rightPos.set(.38,1.32,.42)}
 fireMid.copy(leftPos).add(rightPos).multiplyScalar(.5);fireMid.y+=.10;
 fireGroup.position.copy(fireMid);
 const span=leftPos.distanceTo(rightPos),width=Math.max(.27,Math.min(1.1,span*.7));
 fireCore.scale.setScalar(1+.15*Math.sin(time*11));
 fireLight.intensity=1.6+.7*Math.sin(time*14)**2;
 for(let i=0;i<flames.length;i++){const f=flames[i],phase=i*2.39996+time*(2.3+(i%4)*.22),a=(i%7)/6;
 f.position.set(Math.cos(phase)*width*(.12+.36*a),Math.sin(phase*1.7)*.13+Math.sin(time*4+i)*.04,Math.sin(phase)*.18);
 f.rotation.set(Math.sin(phase)*.6,phase,Math.cos(phase)*.6);
 f.scale.set(.6+a*.8,.55+a*1.8,.6+a*.8);f.material.opacity=.35+.5*Math.abs(Math.sin(time*3+i));
 }
 for(let i=0;i<embers.length;i++){const e=embers[i],cycle=(time*(.28+(i%5)*.07)+i*.183)%1,angle=i*2.399;
 e.position.set(Math.cos(angle+time)*(.06+cycle*.36),cycle*.8-.18,Math.sin(angle+time)*(.07+cycle*.24));e.scale.setScalar(.45+cycle*.7);e.material.opacity=(1-cycle)*.85}
}

function replay(){introStart=performance.now();introActive=true;controls.enabled=false}document.querySelector('#intro').onclick=replay;
let low=mobile;function quality(){low=!low;renderer.setPixelRatio(Math.min(devicePixelRatio,low?1:2));renderer.shadowMap.enabled=!low;sun.castShadow=!low;dust.visible=!low;document.querySelector('#quality').textContent=low?'Quality: Lite':'Quality: High';}document.querySelector('#quality').onclick=quality;
if(mobile)document.querySelector('#quality').textContent='Quality: Auto';
function loaded(){document.querySelector('#loading').hidden=true;if(introActive)replay();else{camera.position.copy(targetPos);controls.enabled=true;controls.update();}}
new FBXLoader().load('./character.fbx',model=>{const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const scale=2.05/Math.max(size.y,.001);model.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);model.scale.setScalar(scale);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(model);character=model;
 model.traverse(o=>{if(o.isBone){const n=o.name.toLowerCase();if(n.endsWith('lefthand'))leftHand=o;if(n.endsWith('righthand'))rightHand=o;}});
 if(model.animations.length){mixer=new THREE.AnimationMixer(model);mixer.clipAction(model.animations[0]).play()}loaded();},e=>{if(e.total)document.querySelector('#loadtext').textContent='Summoning the wizard… '+Math.round(e.loaded/e.total*100)+'%';},err=>{console.error(err);document.querySelector('#loadtext').textContent='Citadel ready — character unavailable';document.querySelector('#error').textContent='Could not load character.fbx';setTimeout(loaded,1200)});
const clock=new THREE.Clock();let t=0;function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);t+=dt;if(mixer)mixer.update(dt);animateFire(t);if(!reduced){for(let i=0;i<clouds.length;i++)clouds[i].position.x+=dt*(.18+i%3*.05);const p=pg.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)+dt*.13;if(y>14)y=.5;p.setY(i,y)}p.needsUpdate=true;}
if(introActive){const u=Math.min((performance.now()-introStart)/9000,1),s=u*u*(3-2*u);camera.position.set(14*(1-s)+targetPos.x*s,17*(1-s)+targetPos.y*s,30*(1-s)+targetPos.z*s);controls.target.lerp(targetLook,u<.8?.015:.07);camera.lookAt(0,2,-7);if(u>=1){introActive=false;controls.enabled=true;controls.target.set(0,1.6,0);camera.position.copy(targetPos)}}else controls.update();
renderer.render(scene,camera)}controls.enabled=!introActive;frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.domElement.addEventListener('pointerdown',()=>{if(introActive){introActive=false;controls.enabled=true;camera.position.copy(targetPos);controls.target.set(0,1.6,0);controls.update()}},{passive:true});
