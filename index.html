<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spellbound 3D — Animation Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101625;color:white;font:14px system-ui}#view{position:fixed;inset:0}#ui{position:fixed;left:12px;right:12px;top:env(safe-area-inset-top,12px);padding:14px;border-radius:14px;background:#111827cc;backdrop-filter:blur(12px)}button{border:1px solid #61708c;background:#263b59;color:white;padding:9px 14px;border-radius:10px}#status{margin:8px 0;color:#b6d5ee}small{color:#cbd5e1}</style></head><body><div id="view"></div><div id="ui"><strong>SPELLBOUND · Animation Lab</strong><div id="status">Loading 3D engine…</div><button id="play">Pause</button> <button id="reset">Reset camera</button><p><small>Drag to rotate · Pinch to zoom · Character file: character.fbx</small></p></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import {FBXLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/FBXLoader.js';
const status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#131e30');
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,2000);camera.position.set(3,2.5,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#view').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd6eaff,0x3a3c4e,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(4,8,5);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0x273e55,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);scene.add(new THREE.GridHelper(12,24,0x37506b,0x26374c));
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);
let mixer=null,playing=true;new FBXLoader().load('./character.fbx',model=>{const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y/2;const scale=2/Math.max(size.y,.001);model.scale.setScalar(scale);model.position.multiplyScalar(scale);scene.add(model);const h=size.y*scale;controls.target.set(0,h*.5,0);camera.position.set(2.7,h*.8,4.5);controls.update();if(model.animations.length){mixer=new THREE.AnimationMixer(model);mixer.clipAction(model.animations[0]).play();status.textContent='Character loaded · '+model.animations.length+' animation(s)';}else status.textContent='Character loaded · no animation tracks found';},undefined,e=>{status.textContent='Could not load character.fbx. Upload it to the repository root and refresh.';console.error(e)});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#reset').onclick=()=>{camera.position.set(3,2.5,5);controls.update()};
const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=clock.getDelta();if(mixer&&playing)mixer.update(dt);controls.update();renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
